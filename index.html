<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Camera Dashboard</title>
    <style>
        body {
            background-color: #000; /* Pure black background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh; /* Locks body to exact TV height */
            width: 100vw; /* Locks body to exact TV width */
            overflow: hidden; /* Prevents scrollbars */
        }
        .camera-grid {
            display: grid;
            /* Creates a 4x4 grid to fit up to 16 cameras perfectly */
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            height: 100%;
            width: 100%;
            gap: 2px; /* Tiny 2px black border between feeds */
        }
        .camera-feed {
            background-color: #111;
            position: relative; /* Allows label to overlay the video */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .camera-feed img, .camera-feed iframe {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Stretches the feed to perfectly fill its grid square */
            border: none;
        }
        .camera-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 8px;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black background */
            text-align: left;
            pointer-events: none; /* Prevents label from blocking clicks */
        }
    </style>
</head>
<body>

    <div class="camera-grid">
        <div class="camera-feed">
            <img src="http://192.168.1.22" alt="Camera 1 Offline">
            <div class="camera-label">Camera 1 (Zone A)</div>
        </div>

        <div class="camera-feed">
            <img src="http://192.168.1.103" alt="Camera 2 Offline">
            <div class="camera-label">Camera 2 (Zone A)</div>
        </div>

        <div class="camera-feed">
            <img src="http://192.168.1.22" alt="Camera 3 Offline">
            <div class="camera-label">Camera 3 (Zone A)</div>
        </div>

        <div class="camera-feed">
            <img src="http://192.168.1.103" alt="Camera 4 Offline">
            <div class="camera-label">Camera 4 (Zone A)</div>
        </div>

        </div>

</body>
</html>
